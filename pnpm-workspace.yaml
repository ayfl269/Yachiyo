packages:
  - 'packages/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - hono@4.13.0

# 锁定已知漏洞的传递依赖到修复版本
overrides:
  tar-fs: ^2.1.4
  bl: ^2.2.1
  ini: ^1.3.8
  # brace-expansion 有三条链路（v1 来自 minimatch@3 → eslint, v2 来自 minimatch@9 → ts-estree, v5 来自 minimatch@10 → ts-estree）
  # 使用版本限定覆盖以仅修补受影响版本（ref: GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg）
  # CVE-2026-13149：DoS via exponential-time expansion of consecutive non-expanding {} groups
  # 影响范围：>= 2.0.0, < 2.1.2 / >= 3.0.0, < 5.0.7 / < 1.1.16
  # 修复版本：v1 = 1.1.16, v2 = 2.1.2, v5 = 5.0.7+（override 到 5.0.8 兼顾 CVE-2026-14257）
  'brace-expansion@1.1.15': 1.1.16
  'brace-expansion@2.1.1': 2.1.2
  'brace-expansion@5.0.6': 5.0.8
  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870（5.x 编号，修复未回移至 3.x/4.x）：
  # !!omap 解析时 resolveYamlOmap() 用 objectKeys.indexOf() 线性扫描做键唯一性校验，
  # 整体复杂度 O(n²)，构造的 YAML 文档可使 yaml.load() 同步阻塞事件循环造成 DoS。
  # 影响范围：3.x >= 3.0.0 < 3.15.1；4.x >= 4.0.0 < 4.3.1；来自 @eslint/eslintrc → js-yaml
  # 修复版本：4.x = 4.3.1（本仓库仅 4.x 链路）
  js-yaml: 4.3.1
  # fast-uri 安全修复链（来自 @modelcontextprotocol/sdk → ajv / ajv-formats → fast-uri）：
  # - GHSA-7p8r-x3mc-p8w7：host confusion via backslash authority introducer（3.1.5 修复）
  # - CVE-2026-75931 / GHSA-5jgf-p345-68v8：scheme-relative 引用跳过 IDN 规范化导致宿主混淆（3.1.6 修复）
  # - CVE-2026-75899 / GHSA-fph4-wmhf-6fwf：重复主机名百分比解码导致 SSRF（3.1.6 修复）
  # - CVE-2026-75975 / GHSA-f65p-4m7j-42xc：IPv6 规范化异常导致 SSRF（3.1.6 修复）
  # - CVE-2026-76172 / GHSA-jqff-g426-hqxp：百分比编码 scheme 规范化导致宿主混淆（3.1.6 修复）
  # - GHSA-qw65-cvwx-89v3：serialize() 端口未校验导致 authority 注入（3.1.7 修复）
  # - GHSA-58mr-gqgx-xq4g：IP 字面量括号不匹配导致宿主混淆（3.1.7 修复）
  # 直接锁 3.x 线头部 3.1.7，避免逐版本追赶后续安全通告
  fast-uri: 3.1.7
  # GHSA-mwp4-54f8-5fhr：ip-address leading-zero octet SSRF / trust-boundary bypass
  # 影响范围：<=10.3.0；来自 @modelcontextprotocol/sdk → express-rate-limit → ip-address
  ip-address: 10.3.1
  # qs 安全修复（来自 @modelcontextprotocol/sdk → express / body-parser → qs）：
  # - CVE-2026-2391 / GHSA-w7fw-mjwx-w883：`[]=` 逗号分组的 arrayLimit 绕过（6.16.0 修复）
  # - CVE-2026-82417 / GHSA-4mjr-xmp4-gh2g：isBuffer() 未校验 constructor.isBuffer 可调用性，
  #   构造 x[constructor][isBuffer]=y 配合 plainObjects/allowPrototypes 可致未捕获 TypeError DoS（6.16.0 修复）
  # 兼容范围：express ^6.14.0 / body-parser ^6.15.2
  qs: 6.16.0
  # SB2026080392 / GHSA-8j4g-w8fx-2239：CORS 中间件 ReDoS via Access-Control-Request-Headers
  # 影响范围：<=4.12.33；仅在使用 cors() 默认/空 allowHeaders 时触发
  hono: 4.13.0
  '@hono/node-server': 2.0.10
