packages:
  - 'packages/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true

# 锁定已知漏洞的传递依赖到修复版本
overrides:
  tar-fs: ^2.1.4
  bl: ^2.2.1
  ini: ^1.3.8
  # brace-expansion 有三条链路（v1 来自 minimatch@3 → eslint, v2 来自 minimatch@9 → ts-estree, v5 来自 minimatch@10 → ts-estree）
  # 使用版本限定覆盖以仅修补受影响版本（ref: GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg）
  # CVE-2026-13149：DoS via exponential-time expansion of consecutive non-expanding {} groups
  # 影响范围：>= 2.0.0, < 2.1.2 / >= 3.0.0, < 5.0.7 / < 1.1.16
  # 修复版本：v1 = 1.1.16, v2 = 2.1.2, v5 = 5.0.7+（override 到 5.0.8 兼顾 CVE-2026-14257）
  'brace-expansion@1.1.15': 1.1.16
  'brace-expansion@2.1.1': 2.1.2
  'brace-expansion@5.0.6': 5.0.8
  js-yaml: 4.3.0
  fast-uri: 3.1.4
  hono: 4.12.27
  '@hono/node-server': 2.0.10
